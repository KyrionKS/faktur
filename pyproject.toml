[project]
name = "faktur"
version = "0.1.0"
description = "Angebote und Rechnungen fuer die New Air Media Group"
requires-python = ">=3.14"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["faktur", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "EXE", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]